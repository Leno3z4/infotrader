name: hourly-market-bots

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run meme/news monitor
        run: python meme_monitor/bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_LIQUIDITY_USD: ${{ vars.MIN_LIQUIDITY_USD }}
          NEWS_LIQUIDITY_USD: ${{ vars.NEWS_LIQUIDITY_USD }}
          WATCH_TOKENS: ${{ vars.WATCH_TOKENS }}
          NFT_COLLECTIONS: ${{ vars.NFT_COLLECTIONS }}
          RESERVOIR_API_KEY: ${{ secrets.RESERVOIR_API_KEY }}

  polymarket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run Polymarket research/decision/execution simulation
        run: python polymarket_trader/bot.py --once
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_RESEARCH_KEYS: GEMINI_API_KEY_1,GEMINI_API_KEY_4
          GEMINI_DECISION_KEYS: GEMINI_API_KEY_2,GEMINI_API_KEY_5
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_MARKETS_PER_RUN: ${{ vars.MAX_MARKETS_PER_RUN }}
          POLYMARKET_PROFILE_ADDRESS: ${{ vars.POLYMARKET_PROFILE_ADDRESS }}
          MAX_POSITION_USD: ${{ vars.MAX_POSITION_USD }}
          MAX_DAILY_LOSS_USD: ${{ vars.MAX_DAILY_LOSS_USD }}
          MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          DRY_RUN: "true"
