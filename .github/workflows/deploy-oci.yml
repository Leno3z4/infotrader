name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Test
        run: pytest -q

      - name: Validate OCI deployment secrets
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$OCI_HOST" ]] || missing+=("OCI_HOST")
          [[ -n "$OCI_USER" ]] || missing+=("OCI_USER")
          [[ -n "$OCI_SSH_PRIVATE_KEY" ]] || missing+=("OCI_SSH_PRIVATE_KEY")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            echo 'Add these under Settings -> Secrets and variables -> Actions -> Repository secrets.' >&2
            exit 1
          fi

          echo "OCI deployment configuration is present for host $OCI_HOST and user $OCI_USER."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OCI_SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.OCI_USER }}/infotrader
            git fetch origin main
            git reset --hard origin/main
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker compose ps
