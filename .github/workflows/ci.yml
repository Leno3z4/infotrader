name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Compile Cloudflare Python sources
        run: python -m compileall -q cloudflare/src
      - name: Verify production trading entrypoint defaults to dry-run
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path("cloudflare/src/polymarket_trader.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          init = next(node for node in ast.walk(tree) if isinstance(node, ast.FunctionDef) and node.name == "__init__")
          text = ast.unparse(init)
          assert 'getattr(env, "POLYMARKET_LIVE_TRADING", "false")' in text
          print("Polymarket live-trading default remains false")
          PY
